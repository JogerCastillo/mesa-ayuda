name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Run smoke test
        run: npm run test:smoke
        env:
          DATA_DIR: ${{ runner.temp }}/mesa-ayuda-smoke-data
          JWT_SECRET: ci-only-jwt-secret-for-smoke-tests-32-plus
          ADMIN_PASSWORD: ci-only-admin-password

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --check "$f" || exit 1
          done
      - name: Check HTML has required tags
        run: |
          grep -q '<html' index.html
          grep -q '<head' index.html
          grep -q '<body' index.html
          grep -q '<title' index.html
